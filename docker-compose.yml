services:
  db:
    image: postgres:16-alpine
    container_name: circulos-db
    environment:
      POSTGRES_USER: circulos
      POSTGRES_PASSWORD: circulos_dev_2026
      POSTGRES_DB: circulos_cuidado_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circulos -d circulos_cuidado_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: circulos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: circulos-api
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://circulos:circulos_dev_2026@db:5432/circulos_cuidado_dev?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm --workspace apps/api run dev"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    container_name: circulos-web
    working_dir: /app
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm --workspace apps/web run dev -- --host 0.0.0.0 --port 5173"

volumes:
  postgres_data:
  redis_data:
